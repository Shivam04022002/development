# =============================================================================
# DealerMitra V2 — Production Nginx configuration (template)
#
# Hosts:
#   app.example.com        → Admin Frontend (static SPA)
#   adminapi.example.com   → Admin Backend  (proxy → 127.0.0.1:5001)
#   dealerapi.example.com  → Mobile Backend (proxy → 127.0.0.1:5000)
#
# Replace *.example.com and the certificate paths, then:
#   sudo cp nginx.production.conf /etc/nginx/sites-available/dealermitra
#   sudo ln -sf /etc/nginx/sites-available/dealermitra /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# ── Rate limiting zones ──────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=admin_api:10m  rate=15r/s;
limit_req_zone $binary_remote_addr zone=mobile_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_api:10m   rate=1r/s;

# ── Shared proxy settings ────────────────────────────────────────────────────
proxy_http_version 1.1;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name app.example.com adminapi.example.com dealerapi.example.com;
    return 301 https://$host$request_uri;
}

# ── Reusable security headers snippet (add_header in each server) ─────────────
# NOTE: repeated per-server because add_header does not inherit once redefined.

# =============================================================================
# 1) Admin Frontend — static SPA
# =============================================================================
server {
    listen 443 ssl http2;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

    add_header X-Frame-Options            "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options     "nosniff"                             always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"     always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root  /var/www/dealermitra/admin/admin-frontend/dist;
    index index.html;

    # SPA fallback
    location / { try_files $uri $uri/ /index.html; }

    # Long-cache immutable static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ /\. { deny all; }
}

# =============================================================================
# 2) Admin Backend API — proxy → 5001
# =============================================================================
server {
    listen 443 ssl http2;
    server_name adminapi.example.com;

    ssl_certificate     /etc/letsencrypt/live/adminapi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adminapi.example.com/privkey.pem;

    add_header X-Frame-Options            "DENY"                                always;
    add_header X-Content-Type-Options     "nosniff"                             always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"     always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;

    client_max_body_size 15m;   # matches upload limit
    gzip on; gzip_vary on; gzip_min_length 1024;
    gzip_types application/json application/javascript text/plain;

    # Health checks (no rate limit)
    location /health { proxy_pass http://127.0.0.1:5001; }

    # Stricter limit on auth
    location /api/auth {
        limit_req zone=auth_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:5001;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Secure file downloads (authenticated in the app) + all other API
    location / {
        limit_req zone=admin_api burst=30 nodelay;
        proxy_pass         http://127.0.0.1:5001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

# =============================================================================
# 3) Mobile Backend API — proxy → 5000
#    Serves the dealer API, the secure /api/files downloads, and the public
#    /files image route (the backend already restricts /files to images).
# =============================================================================
server {
    listen 443 ssl http2;
    server_name dealerapi.example.com;

    ssl_certificate     /etc/letsencrypt/live/dealerapi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dealerapi.example.com/privkey.pem;

    add_header X-Frame-Options            "DENY"                                always;
    add_header X-Content-Type-Options     "nosniff"                             always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;

    client_max_body_size 15m;   # matches upload limit
    gzip on; gzip_vary on; gzip_min_length 1024;
    gzip_types application/json application/javascript text/plain;

    location /health { proxy_pass http://127.0.0.1:5000; }

    location /api/auth {
        limit_req zone=auth_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public uploaded IMAGES (cacheable). The backend only exposes images here;
    # CIBIL JSON / Credit Note PDFs are NOT public (served via /api/files w/ auth).
    location /files/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        limit_req zone=mobile_api burst=40 nodelay;
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
