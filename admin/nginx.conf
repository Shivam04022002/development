# =============================================================================
# Nginx Production Configuration — surjitfinance.com
# Architecture:
#   dealer.surjitfinance.com      → React Admin Frontend  (static files)
#   dealeradmin.surjitfinance.com → Admin Backend Node.js (port 5001)
#   dealerapi.surjitfinance.com   → Mobile Backend Node.js (port 5000)
#
# Deploy:
#   sudo cp nginx.conf /etc/nginx/sites-available/surjitfinance
#   sudo ln -sf /etc/nginx/sites-available/surjitfinance /etc/nginx/sites-enabled/surjitfinance
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=admin_api_limit:10m  rate=10r/s;
limit_req_zone $binary_remote_addr zone=mobile_api_limit:10m rate=20r/s;

# =============================================================================
# HTTP → HTTPS redirect (all three subdomains)
# =============================================================================
server {
    listen 80;
    server_name dealer.surjitfinance.com dealeradmin.surjitfinance.com dealerapi.surjitfinance.com;
    return 301 https://$host$request_uri;
}

# =============================================================================
# BLOCK 1 — dealer.surjitfinance.com → React Admin Frontend (static)
# =============================================================================
server {
    listen 443 ssl http2;
    server_name dealer.surjitfinance.com;

    ssl_certificate     /etc/letsencrypt/live/dealer.surjitfinance.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dealer.surjitfinance.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options            "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options     "nosniff"                       always;
    add_header X-XSS-Protection           "1; mode=block"                 always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy    "default-src 'self'; connect-src 'self' https://dealeradmin.surjitfinance.com; img-src 'self' data: https://res.cloudinary.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    root  /var/www/admin/admin-frontend/dist;
    index index.html;

    # React SPA — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable static assets — cache 1 year
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
    }
}

# =============================================================================
# BLOCK 2 — dealeradmin.surjitfinance.com → Admin Backend (port 5001)
# =============================================================================
server {
    listen 443 ssl http2;
    server_name dealeradmin.surjitfinance.com;

    ssl_certificate     /etc/letsencrypt/live/dealeradmin.surjitfinance.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dealeradmin.surjitfinance.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options           "DENY"                           always;
    add_header X-Content-Type-Options    "nosniff"                        always;
    add_header X-XSS-Protection          "1; mode=block"                  always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/plain;

    # Proxy all traffic to Admin Backend Node.js
    location / {
        limit_req zone=admin_api_limit burst=30 nodelay;

        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Upload size limit (adjust if you handle file uploads here)
        client_max_body_size 10m;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
    }
}

# =============================================================================
# BLOCK 3 — dealerapi.surjitfinance.com → Mobile Backend (port 5000)
# =============================================================================
server {
    listen 443 ssl http2;
    server_name dealerapi.surjitfinance.com;

    ssl_certificate     /etc/letsencrypt/live/dealerapi.surjitfinance.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dealerapi.surjitfinance.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options           "DENY"                           always;
    add_header X-Content-Type-Options    "nosniff"                        always;
    add_header X-XSS-Protection          "1; mode=block"                  always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/plain;

    # Proxy all traffic to Mobile Backend Node.js
    location / {
        limit_req zone=mobile_api_limit burst=50 nodelay;

        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # File upload limit (Cloudinary multipart uploads)
        client_max_body_size 25m;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
    }
}
